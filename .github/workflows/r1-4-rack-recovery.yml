name: R1-4 Rack Recovery Tracer

on:
  pull_request:
    paths:
      - '.github/workflows/r1-4-rack-recovery.yml'
      - '.github/workflows/compat-test-build.yml'
      - 'tests/r1_1/**'
      - 'tests/r1_2/**'
      - 'tests/r1_3/**'
      - 'tests/r1_4/**'
      - 'src/rack/**'
      - 'src/host/hosted_plugin.cpp'
      - 'src/host/hosted_plugin.hpp'
      - 'src/host/process_block_view.hpp'
      - 'src/common/recovery_policy.hpp'
      - 'src/common/vst3_host_contract.hpp'
      - 'src/common/protocol.hpp'
      - 'CMakeLists.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r1-4-rack-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-rack-recovery:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure deterministic R1-4 recovery integration
        run: cmake -S tests/r1_4 -B build/r1-4 -A x64
      - name: Build Rack helper and deterministic crash fixtures
        run: cmake --build build/r1-4 --config Release --target r1-4-rack-recovery-integration --parallel
      - name: Run real Rack crash breadcrumb and bounded restart tracer
        run: ctest --test-dir build/r1-4 -C Release --output-on-failure
