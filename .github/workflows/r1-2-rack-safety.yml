name: R1-2 Rack Safety Tracer

on:
  pull_request:
    paths:
      - '.github/workflows/r1-2-rack-safety.yml'
      - '.github/workflows/compat-test-build.yml'
      - 'tests/r1_2/**'
      - 'src/rack/**'
      - 'src/host/hosted_plugin.cpp'
      - 'src/host/hosted_plugin.hpp'
      - 'src/host/process_block_view.hpp'
      - 'src/common/vst3_host_contract.hpp'
      - 'src/common/protocol.hpp'
      - 'CMakeLists.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r1-2-rack-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-rack-safety:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure deterministic R1-2 integration
        run: cmake -S tests/r1_2 -B build/r1-2 -A x64
      - name: Build Rack helper and deterministic fixtures
        run: cmake --build build/r1-2 --config Release --target r1-2-rack-safety-integration --parallel
      - name: Run real Rack bypass latency fail-dry tracer
        run: ctest --test-dir build/r1-2 -C Release --output-on-failure
