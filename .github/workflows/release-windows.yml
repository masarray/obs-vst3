name: Release Windows

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag, for example v0.2.0-preview.1'
        required: true
        type: string
      obs_version:
        description: 'Pinned OBS Studio version used to build libobs'
        required: true
        default: '32.2.2'
        type: string
      prerelease:
        description: 'Publish as a GitHub prerelease'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-package-release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release v'))
    name: Build, validate, package and release
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Resolve release inputs
        id: release
        env:
          RELEASE_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $Tag = '${{ inputs.version }}'.Trim()
            $ObsVersion = '${{ inputs.obs_version }}'.Trim()
            $PreRelease = '${{ inputs.prerelease }}' -eq 'true'
          }
          elseif ('${{ github.ref }}'.StartsWith('refs/tags/v')) {
            $Tag = '${{ github.ref_name }}'.Trim()
            $ObsVersion = '32.2.2'
            $PreRelease = $Tag.Contains('-')
          }
          else {
            $Match = [regex]::Match($env:RELEASE_COMMIT_MESSAGE, '^Release (v\d+\.\d+\.\d+(?:[-.][0-9A-Za-z.-]+)?)')
            if (-not $Match.Success) {
              throw 'Main-branch release trigger did not contain a valid Release vMAJOR.MINOR.PATCH marker.'
            }
            $Tag = $Match.Groups[1].Value
            $ObsVersion = '32.2.2'
            $PreRelease = $Tag.Contains('-')
          }

          if (-not $Tag.StartsWith('v')) {
            $Tag = "v$Tag"
          }
          if ($Tag -notmatch '^v\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') {
            throw "Invalid release version '$Tag'. Expected vMAJOR.MINOR.PATCH or a prerelease suffix."
          }
          if ($ObsVersion -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid OBS version '$ObsVersion'."
          }

          $Version = $Tag.Substring(1)
          "tag=$Tag" >> $env:GITHUB_OUTPUT
          "version=$Version" >> $env:GITHUB_OUTPUT
          "obs_version=$ObsVersion" >> $env:GITHUB_OUTPUT
          "prerelease=$($PreRelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

          "### Windows release plan" >> $env:GITHUB_STEP_SUMMARY
          "- Release: ``$Tag``" >> $env:GITHUB_STEP_SUMMARY
          "- OBS/libobs baseline: ``$ObsVersion``" >> $env:GITHUB_STEP_SUMMARY
          "- Smart Installer + portable ZIP + isolated scanner + SHA-256 checksums" >> $env:GITHUB_STEP_SUMMARY

      - name: Run portable protocol tests
        run: |
          cmake -S . -B build/protocol -DSAFEVST3_BUILD_OBS_PLUGIN=OFF -DSAFEVST3_BUILD_TESTS=ON
          cmake --build build/protocol --config Release --target protocol-layout-test --parallel
          ctest --test-dir build/protocol -C Release --output-on-failure

      - name: Fetch pinned OBS Studio source
        run: |
          git clone --branch "${{ steps.release.outputs.obs_version }}" --depth 1 --recurse-submodules --shallow-submodules https://github.com/obsproject/obs-studio.git .obs-sdk

      - name: Adapt OBS preset to hosted VS2022
        working-directory: .obs-sdk
        run: |
          $Path = 'CMakePresets.json'
          $Text = Get-Content $Path -Raw
          $Text = $Text.Replace('Visual Studio 18 2026', 'Visual Studio 17 2022')
          $Text = $Text.Replace('x64,version=10.0.26100.0', 'x64')
          Set-Content -Path $Path -Value $Text -Encoding UTF8

      - name: Build pinned OBS/libobs SDK
        working-directory: .obs-sdk
        env:
          CI: 'true'
        run: |
          .\.github\scripts\Build-Windows.ps1 -Target x64 -Configuration Release

      - name: Stage libobs development package
        id: libobs
        run: |
          $Generated = Get-ChildItem -Path '.obs-sdk' -Filter 'libobsConfig.cmake' -File -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch '[\\/]install[\\/]' } |
            Select-Object -First 1
          if (-not $Generated) {
            throw 'Generated libobsConfig.cmake was not found after the pinned OBS build.'
          }

          $BuildRoot = Split-Path $Generated.Directory.FullName -Parent
          if (-not (Test-Path (Join-Path $BuildRoot 'cmake_install.cmake'))) {
            throw "Could not derive the OBS CMake build root from $($Generated.FullName)."
          }

          $SdkPrefix = Join-Path $env:RUNNER_TEMP 'obs-libobs-sdk'
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $SdkPrefix
          cmake --install $BuildRoot --prefix $SdkPrefix --config Release --component Development
          if ($LASTEXITCODE -ne 0) {
            throw "Installing the OBS Development component failed with exit code $LASTEXITCODE."
          }

          $Config = Get-ChildItem -Path $SdkPrefix -Filter 'libobsConfig.cmake' -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $Config) {
            throw 'libobsConfig.cmake was not installed by the OBS Development component.'
          }
          if (-not (Test-Path (Join-Path $Config.Directory.FullName 'libobsTargets.cmake'))) {
            throw 'Staged libobs package is incomplete: libobsTargets.cmake is missing.'
          }
          if (-not (Test-Path (Join-Path $Config.Directory.FullName 'finders\FindSIMDe.cmake'))) {
            throw 'Staged libobs package is incomplete: FindSIMDe.cmake is missing.'
          }

          $W32PthreadsConfig = Get-ChildItem -Path $SdkPrefix -Filter 'w32-pthreadsConfig.cmake' -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $W32PthreadsConfig) {
            throw 'Staged OBS Development package is incomplete: w32-pthreadsConfig.cmake is missing.'
          }

          $ObsDepsRoot = Join-Path '.obs-sdk' '.deps'
          $ObsDepsPrefix = Get-ChildItem -Path $ObsDepsRoot -Directory -Filter 'obs-deps-*-x64' -ErrorAction SilentlyContinue |
            Where-Object { Test-Path (Join-Path $_.FullName 'include\simde\simde-common.h') } |
            Select-Object -First 1
          if (-not $ObsDepsPrefix) {
            throw 'OBS public dependency prefix containing include\simde\simde-common.h was not found.'
          }

          "dir=$($Config.Directory.FullName)" >> $env:GITHUB_OUTPUT
          "prefix=$SdkPrefix" >> $env:GITHUB_OUTPUT
          "deps_prefix=$($ObsDepsPrefix.FullName)" >> $env:GITHUB_OUTPUT
          Write-Host "Using staged libobs package: $($Config.FullName)"
          Write-Host "Using staged w32-pthreads package: $($W32PthreadsConfig.FullName)"
          Write-Host "Using OBS public dependency prefix: $($ObsDepsPrefix.FullName)"

      - name: Configure OBS Safe VST3 Host
        run: |
          cmake -S . -B build/release -A x64 `
            "-Dlibobs_DIR=${{ steps.libobs.outputs.dir }}" `
            "-DCMAKE_PREFIX_PATH=${{ steps.libobs.outputs.prefix }};${{ steps.libobs.outputs.deps_prefix }}" `
            -DSAFEVST3_BUILD_OBS_PLUGIN=ON `
            -DSAFEVST3_BUILD_TESTS=ON

      - name: Build plugin, helper, scanner and tests
        run: |
          cmake --build build/release --config Release --target obs-safe-vst3 obs-safe-vst3-host obs-safe-vst3-scanner protocol-layout-test --parallel

      - name: Run Windows tests
        run: ctest --test-dir build/release -C Release --output-on-failure

      - name: Verify release binaries
        run: |
          $Dll = Get-ChildItem build/release -Filter 'obs-safe-vst3.dll' -File -Recurse | Select-Object -First 1
          $Host = Get-ChildItem build/release -Filter 'obs-safe-vst3-host.exe' -File -Recurse | Select-Object -First 1
          $Scanner = Get-ChildItem build/release -Filter 'obs-safe-vst3-scanner.exe' -File -Recurse | Select-Object -First 1
          if (-not $Dll) { throw 'obs-safe-vst3.dll was not built.' }
          if (-not $Host) { throw 'obs-safe-vst3-host.exe was not built.' }
          if (-not $Scanner) { throw 'obs-safe-vst3-scanner.exe was not built.' }
          Write-Host "Plugin:  $($Dll.FullName)"
          Write-Host "Host:    $($Host.FullName)"
          Write-Host "Scanner: $($Scanner.FullName)"

          $ScanCache = Join-Path $env:RUNNER_TEMP 'scanner-smoke.tsv'
          Remove-Item -Force -ErrorAction SilentlyContinue $ScanCache
          $ScanProcess = Start-Process -FilePath $Scanner.FullName -ArgumentList '--scan-to', "`"$ScanCache`"" -Wait -PassThru
          if ($ScanProcess.ExitCode -ne 0) {
            throw "Scanner smoke test failed with exit code $($ScanProcess.ExitCode)."
          }
          if (-not (Test-Path $ScanCache)) {
            throw 'Scanner smoke test did not create a cache file.'
          }

      - name: Ensure Inno Setup 6
        id: inno
        run: |
          $Candidates = @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe'
          )
          $Iscc = $Candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $Iscc) {
            choco install innosetup -y --no-progress
            $Iscc = $Candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $Iscc) {
            throw 'Inno Setup 6 compiler could not be located.'
          }
          "path=$Iscc" >> $env:GITHUB_OUTPUT

      - name: Build Smart Installer and portable ZIP
        run: |
          .\scripts\package-windows.ps1 `
            -BuildDir 'build/release' `
            -Version '${{ steps.release.outputs.version }}' `
            -Iscc '${{ steps.inno.outputs.path }}'

      - name: Validate portable ZIP layout
        run: |
          $Zip = Get-ChildItem dist -Filter '*-Windows-x64-Portable.zip' -File | Select-Object -First 1
          if (-not $Zip) { throw 'Portable ZIP was not created.' }

          $Extract = Join-Path $env:RUNNER_TEMP 'portable-smoke'
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $Extract
          Expand-Archive -Path $Zip.FullName -DestinationPath $Extract -Force

          $Expected = @(
            'obs-plugins\64bit\obs-safe-vst3.dll',
            'obs-plugins\64bit\obs-safe-vst3-host.exe',
            'obs-plugins\64bit\obs-safe-vst3-scanner.exe',
            'data\obs-plugins\obs-safe-vst3\locale\en-US.ini',
            'README-FIRST.txt',
            'UNINSTALL-MANUAL.cmd'
          )
          foreach ($Relative in $Expected) {
            if (-not (Test-Path (Join-Path $Extract $Relative))) {
              throw "Portable package missing: $Relative"
            }
          }

      - name: Smoke-test Smart Installer on synthetic portable OBS
        run: |
          $Setup = Get-ChildItem dist -Filter '*-Setup-x64.exe' -File | Select-Object -First 1
          if (-not $Setup) { throw 'Smart Installer was not created.' }

          $SyntheticObs = Join-Path $env:RUNNER_TEMP 'synthetic-obs'
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $SyntheticObs
          New-Item -ItemType Directory -Force -Path (Join-Path $SyntheticObs 'bin\64bit') | Out-Null
          Set-Content -Path (Join-Path $SyntheticObs 'bin\64bit\obs64.exe') -Value 'synthetic OBS marker' -Encoding ASCII

          $PortableArg = "/PortableObsDir=`"$SyntheticObs`""
          $Process = Start-Process -FilePath $Setup.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', $PortableArg -Wait -PassThru
          if ($Process.ExitCode -ne 0) {
            throw "Smart Installer failed with exit code $($Process.ExitCode)."
          }

          $Expected = @(
            'obs-plugins\64bit\obs-safe-vst3.dll',
            'obs-plugins\64bit\obs-safe-vst3-host.exe',
            'obs-plugins\64bit\obs-safe-vst3-scanner.exe',
            'data\obs-plugins\obs-safe-vst3\locale\en-US.ini'
          )
          foreach ($Relative in $Expected) {
            if (-not (Test-Path (Join-Path $SyntheticObs $Relative))) {
              throw "Installer smoke test missing: $Relative"
            }
          }

          $UninstallerRoot = Join-Path $env:ProgramFiles 'OBS Safe VST3 Host'
          $Uninstaller = Get-ChildItem -Path $UninstallerRoot -Filter 'unins*.exe' -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $Uninstaller) {
            throw 'Registered uninstaller was not created.'
          }
          $UninstallProcess = Start-Process -FilePath $Uninstaller.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($UninstallProcess.ExitCode -ne 0) {
            throw "Uninstaller smoke test failed with exit code $($UninstallProcess.ExitCode)."
          }
          if (Test-Path (Join-Path $SyntheticObs 'obs-plugins\64bit\obs-safe-vst3.dll')) {
            throw 'Uninstaller did not remove the plugin DLL from the custom OBS tree.'
          }
          if (Test-Path (Join-Path $SyntheticObs 'obs-plugins\64bit\obs-safe-vst3-scanner.exe')) {
            throw 'Uninstaller did not remove the isolated scanner from the custom OBS tree.'
          }

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OBS-Safe-VST3-Host-${{ steps.release.outputs.tag }}-windows-x64
          if-no-files-found: error
          path: |
            dist/*-Setup-x64.exe
            dist/*-Windows-x64-Portable.zip
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $Tag = '${{ steps.release.outputs.tag }}'
          $Title = "OBS Safe VST3 Host $Tag"
          $Assets = Get-ChildItem dist -File | Where-Object {
            $_.Name -like '*-Setup-x64.exe' -or
            $_.Name -like '*-Windows-x64-Portable.zip' -or
            $_.Name -eq 'SHA256SUMS.txt'
          } | Sort-Object Name

          if (-not $Assets) { throw 'No release assets found.' }
          $AssetPaths = @($Assets | ForEach-Object { $_.FullName })

          gh release view $Tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $Tag @AssetPaths --clobber
          }
          else {
            $Args = @('release', 'create', $Tag) + $AssetPaths + @(
              '--target', $env:GITHUB_SHA,
              '--title', $Title,
              '--generate-notes'
            )
            if ('${{ steps.release.outputs.prerelease }}' -eq 'true') {
              $Args += '--prerelease'
            }
            & gh @Args
            if ($LASTEXITCODE -ne 0) {
              throw "GitHub Release creation failed with exit code $LASTEXITCODE."
            }
          }
