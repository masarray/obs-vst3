name: R1-1 Rack Serial Tracer

on:
  pull_request:
    paths:
      - '.github/workflows/r1-1-rack-serial.yml'
      - '.github/workflows/compat-test-build.yml'
      - 'tests/r1_1/**'
      - 'src/rack/**'
      - 'src/host/hosted_plugin.cpp'
      - 'src/host/hosted_plugin.hpp'
      - 'src/host/process_block_view.hpp'
      - 'src/common/vst3_host_contract.hpp'
      - 'src/common/protocol.hpp'
      - 'CMakeLists.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r1-1-rack-serial-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-rack-serial:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure deterministic R1-1 integration
        run: cmake -S tests/r1_1 -B build/r1-1 -A x64
      - name: Build Rack helper and deterministic fixtures
        run: cmake --build build/r1-1 --config Release --target r1-1-rack-serial-integration --parallel
      - name: Run real Rack transport serial tracer
        run: ctest --test-dir build/r1-1 -C Release --output-on-failure
