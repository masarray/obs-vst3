name: S1.5 Apply Patch
on:
  push:
    branches: [s1-5-dynamic-io]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[s1.5-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align deterministic marker
        run: python scripts/fix_s1_5_script.py
      - name: Apply S1.5 patch
        run: python scripts/apply_s1_5_engine.py
      - name: Validate
        run: git diff --check
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f scripts/apply_s1_5_engine.py scripts/fix_s1_5_script.py .github/workflows/s1-5-apply.yml
          git add -A
          git diff --cached --check
          git commit -m "feat: handle dynamic VST3 mono stereo I/O [s1.5-applied]"
          git push origin HEAD:s1-5-dynamic-io
