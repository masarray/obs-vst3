name: Apply stabilization source patch

on:
  push:
    branches:
      - fix/obs-load-compatibility
    paths:
      - '.github/workflows/apply-stabilization.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stabilization branch
        uses: actions/checkout@v4
        with:
          ref: fix/obs-load-compatibility
          fetch-depth: 0

      - name: Apply runtime and release-gate patch
        shell: bash
        run: |
          cat > /tmp/apply_patch.py <<'PY'
          from pathlib import Path

          plugin = Path('src/obs-plugin/plugin.cpp')
          text = plugin.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str):
              global text
              if old not in text:
                  raise SystemExit(f'missing expected plugin block: {label}')
              text = text.replace(old, new, 1)

          replace_once(
              'std::mutex scanner_mutex;\nstd::jthread startup_scanner_thread;\n',
              '''enum class ScannerRunResult {\n    Success,\n    Failed,\n    Busy,\n    Cancelled,\n};\n\nstd::atomic<bool> scanner_in_progress{false};\nstd::jthread startup_scanner_thread;\nstd::jthread manual_scanner_thread;\nstd::mutex manual_scanner_thread_mutex;\n''',
              'scanner globals')

          start = text.index('bool run_scanner(std::stop_token stop = {})')
          end = text.index('\nvoid start_startup_scanner()', start)
          text = text[:start] + r'''ScannerRunResult run_scanner(std::stop_token stop = {})
          {
              bool expected = false;
              if (!scanner_in_progress.compare_exchange_strong(
                      expected, true, std::memory_order_acq_rel, std::memory_order_acquire))
                  return ScannerRunResult::Busy;

              struct ScanRunReset {
                  ~ScanRunReset()
                  {
                      scanner_in_progress.store(false, std::memory_order_release);
                  }
              } reset;

              if (stop.stop_requested())
                  return ScannerRunResult::Cancelled;

              const auto scanner = scanner_path();
              const auto cache = scan_cache_path();
              if (scanner.empty() || cache.empty() || !std::filesystem::exists(scanner)) {
                  blog(LOG_ERROR, "[obs-safe-vst3] isolated scanner executable not found next to loaded module: %s",
                       scanner.string().c_str());
                  return ScannerRunResult::Failed;
              }

              std::error_code ec;
              std::filesystem::create_directories(cache.parent_path(), ec);

              std::wstring command = quote(scanner.wstring()) + L" --scan-to " + quote(cache.wstring());
              STARTUPINFOW si{};
              si.cb = sizeof(si);
              PROCESS_INFORMATION pi{};
              if (!CreateProcessW(scanner.c_str(), command.data(), nullptr, nullptr, FALSE,
                                  CREATE_NO_WINDOW, nullptr, scanner.parent_path().c_str(), &si, &pi)) {
                  blog(LOG_ERROR, "[obs-safe-vst3] failed to start isolated VST3 scanner (Win32 error %lu)",
                       static_cast<unsigned long>(GetLastError()));
                  return ScannerRunResult::Failed;
              }

              const ULONGLONG deadline = GetTickCount64() + 180000;
              DWORD wait = WAIT_TIMEOUT;
              while (!stop.stop_requested()) {
                  const ULONGLONG now = GetTickCount64();
                  if (now >= deadline)
                      break;
                  const DWORD slice = static_cast<DWORD>(std::min<ULONGLONG>(250, deadline - now));
                  wait = WaitForSingleObject(pi.hProcess, slice);
                  if (wait == WAIT_OBJECT_0 || wait == WAIT_FAILED)
                      break;
              }

              DWORD code = 1;
              if (stop.stop_requested()) {
                  TerminateProcess(pi.hProcess, ERROR_CANCELLED);
                  (void)WaitForSingleObject(pi.hProcess, 2000);
              } else if (wait == WAIT_OBJECT_0) {
                  GetExitCodeProcess(pi.hProcess, &code);
              } else {
                  TerminateProcess(pi.hProcess, 0xDEAD);
                  (void)WaitForSingleObject(pi.hProcess, 2000);
                  if (wait != WAIT_FAILED)
                      blog(LOG_WARNING, "[obs-safe-vst3] installed VST3 scan exceeded 180 seconds; current cache kept");
              }
              CloseHandle(pi.hThread);
              CloseHandle(pi.hProcess);

              if (stop.stop_requested())
                  return ScannerRunResult::Cancelled;
              if (wait != WAIT_OBJECT_0 || code != 0) {
                  blog(LOG_WARNING, "[obs-safe-vst3] isolated VST3 scan did not complete successfully");
                  return ScannerRunResult::Failed;
              }
              return ScannerRunResult::Success;
          }
          ''' + text[end:]

          start = text.index('void start_startup_scanner()')
          end = text.index('\nstd::vector<ScanEntry> load_scan_cache()', start)
          text = text[:start] + r'''void start_startup_scanner()
          {
              if (startup_scanner_thread.joinable())
                  return;

              startup_scanner_thread = std::jthread([](std::stop_token stop) {
                  // Start almost immediately after module registration. Discovery and
                  // vendor probing remain completely outside OBS UI/audio threads.
                  std::this_thread::sleep_for(std::chrono::milliseconds(100));
                  if (stop.stop_requested())
                      return;
                  blog(LOG_INFO, "[obs-safe-vst3] background installed VST3 discovery started");
                  const auto result = run_scanner(stop);
                  if (result == ScannerRunResult::Success)
                      blog(LOG_INFO, "[obs-safe-vst3] background installed VST3 discovery completed");
                  else if (result == ScannerRunResult::Failed)
                      blog(LOG_WARNING, "[obs-safe-vst3] background installed VST3 discovery failed; existing cache kept");
              });
          }

          void stop_scanners()
          {
              startup_scanner_thread.request_stop();
              {
                  std::lock_guard lock(manual_scanner_thread_mutex);
                  manual_scanner_thread.request_stop();
              }
              startup_scanner_thread = std::jthread{};
              {
                  std::lock_guard lock(manual_scanner_thread_mutex);
                  manual_scanner_thread = std::jthread{};
              }
          }
          ''' + text[end:]

          replace_once(
              '''    const auto entries = load_scan_cache();\n    if (entries.empty()) {\n        obs_property_list_add_string(list, obs_module_text("NoPluginsScanned"), "");\n        return;\n    }\n''',
              '''    const auto entries = load_scan_cache();\n    if (entries.empty()) {\n        obs_property_list_add_string(\n            list,\n            obs_module_text(scanner_in_progress.load(std::memory_order_acquire)\n                                ? "ScanningPlugins"\n                                : "NoPluginsScanned"),\n            "");\n        return;\n    }\n''',
              'empty list status')

          start = text.index('bool rescan_button(obs_properties_t* props, obs_property_t*, void* data)')
          end = text.index('\nbool split_selection(', start)
          text = text[:start] + r'''bool rescan_button(obs_properties_t* props, obs_property_t*, void* data)
          {
              auto* filter = static_cast<Filter*>(data);
              hide_editor_before_scan(filter);

              // Refresh immediately from the discovery seed/cache. Never wait for
              // vendor probing on the OBS UI thread.
              populate_plugin_list(obs_properties_get(props, kPluginPath));
              if (scanner_in_progress.load(std::memory_order_acquire)) {
                  blog(LOG_INFO, "[obs-safe-vst3] Rescan requested while discovery is already active; reusing active scan");
                  return true;
              }

              obs_source_t* context = nullptr;
              if (filter && filter->context && !filter->shutting_down.load(std::memory_order_acquire))
                  context = obs_source_get_ref(filter->context);

              std::lock_guard lock(manual_scanner_thread_mutex);
              if (manual_scanner_thread.joinable())
                  manual_scanner_thread = std::jthread{};
              manual_scanner_thread = std::jthread([context](std::stop_token stop) {
                  const auto result = run_scanner(stop);
                  if (result == ScannerRunResult::Success)
                      blog(LOG_INFO, "[obs-safe-vst3] installed VST3 cache refreshed");
                  else if (result == ScannerRunResult::Busy)
                      blog(LOG_INFO, "[obs-safe-vst3] manual Rescan reused an already active discovery pass");

                  if (context) {
                      if (!stop.stop_requested())
                          obs_source_update_properties(context);
                      obs_source_release(context);
                  }
              });
              return true;
          }
          ''' + text[end:]

          replace_once(
              '''    blog(LOG_INFO, "[obs-safe-vst3] Phase S stable module loaded");\n    return true;\n}\n\nvoid obs_module_unload(void)\n{\n    stop_startup_scanner();\n''',
              '''    const auto module_dir = module_binary_dir();\n    const auto scanner = scanner_path();\n    const auto cache = scan_cache_path();\n    blog(LOG_INFO,\n         "[obs-safe-vst3] Phase S module loaded; module_dir=%s scanner=%s cache=%s",\n         module_dir.string().c_str(), scanner.string().c_str(), cache.string().c_str());\n    return true;\n}\n\nvoid obs_module_unload(void)\n{\n    stop_scanners();\n''',
              'module unload/log')

          plugin.write_text(text, encoding='utf-8')

          locale = Path('data/locale/en-US.ini')
          loc = locale.read_text(encoding='utf-8')
          if 'ScanningPlugins=' not in loc:
              loc = loc.replace(
                  'NoPluginsScanned="No installed VST3 plug-ins found — use Browse below [root-test4]"\n',
                  'NoPluginsScanned="No installed VST3 plug-ins found — use Browse below [stabilize-test5]"\n'
                  'ScanningPlugins="Scanning installed VST3 plug-ins in background… [stabilize-test5]"\n')
          loc = loc.replace('[root-test4]', '[stabilize-test5]')
          locale.write_text(loc, encoding='utf-8')

          release = Path('.github/workflows/release-windows.yml')
          r = release.read_text(encoding='utf-8')
          r = r.replace('Smoke-test Smart Installer and remembered portable target',
                        'Smoke-test Smart Installer and remembered OBS root', 1)
          r = r.replace(
              '# First install: explicit portable root, as a first-time user would choose.\n'
              '          $PortableArg = "/PortableObsDir=`"$SyntheticObs`""\n'
              "          $FirstInstall = Start-Process -FilePath $Setup.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', $PortableArg -Wait -PassThru",
              '# First install: explicit canonical OBS root.\n'
              '          $ObsRootArg = "/ObsRoot=`"$SyntheticObs`""\n'
              "          $FirstInstall = Start-Process -FilePath $Setup.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', $ObsRootArg -Wait -PassThru",
              1)
          old = '''          $Remembered = Get-ItemProperty -Path $SettingsReg
          if ($Remembered.LastInstallMode -ne 'portable') {
            throw "Installer remembered unexpected mode '$($Remembered.LastInstallMode)'."
          }
          $ExpectedRoot = [IO.Path]::GetFullPath($SyntheticObs).TrimEnd('\\')
          $RememberedRoot = [IO.Path]::GetFullPath([string]$Remembered.LastPortableObsDir).TrimEnd('\\')
'''
          new = '''          $Remembered = Get-ItemProperty -Path $SettingsReg
          $ExpectedRoot = [IO.Path]::GetFullPath($SyntheticObs).TrimEnd('\\')
          $RememberedRoot = [IO.Path]::GetFullPath([string]$Remembered.LastObsRoot).TrimEnd('\\')
'''
          if old not in r:
              raise SystemExit('missing release remembered-target block')
          r = r.replace(old, new, 1)
          r = r.replace(
              '# Second install: no /PortableObsDir at all. The remembered portable\n'
              '          # mode/path must make a future update one-click and target the same OBS.',
              '# Second install: no target argument. The remembered canonical OBS\n'
              '          # root must make a future update one-click and target the same installation.',
              1)
          release.write_text(r, encoding='utf-8')
          PY
          python /tmp/apply_patch.py
          git diff --check

      - name: Commit and push stabilization patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/obs-plugin/plugin.cpp data/locale/en-US.ini .github/workflows/release-windows.yml
          git commit -m "fix: stabilize scanner UI and OBS-root packaging"
          git push origin HEAD:fix/obs-load-compatibility
