name: Clean Install Test Package

on:
  pull_request:
    paths:
      - '.github/workflows/clean-test-package.yml'
      - 'installer/windows/obs-safe-vst3.iss'
      - 'data/locale/en-US.ini'

permissions:
  contents: read
  actions: read

jobs:
  package-clean-test:
    runs-on: windows-2022
    steps:
      - name: Checkout current installer/locale
        uses: actions/checkout@v4

      - name: Download previously validated compat-test2 binaries
        uses: actions/download-artifact@v4
        with:
          name: OBS-Safe-VST3-Host-v0.4.1-compat-test2-windows-x64
          path: prior
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: masarray/obs-vst3
          run-id: 32702856293

      - name: Stage validated binaries with root-test4 locale
        shell: pwsh
        run: |
          $Zip = Get-ChildItem prior -Filter '*Portable.zip' -File -Recurse | Select-Object -First 1
          if (-not $Zip) { throw 'Validated compat-test2 portable package not found' }
          $Expanded = Join-Path $env:RUNNER_TEMP 'compat-test2-expanded'
          Expand-Archive $Zip.FullName -DestinationPath $Expanded -Force
          $Payload = 'installer/windows/payload'
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $Payload
          New-Item -ItemType Directory -Force -Path $Payload | Out-Null
          foreach ($Name in @('obs-safe-vst3.dll','obs-safe-vst3-host.exe','obs-safe-vst3-scanner.exe')) {
            $Binary = Get-ChildItem $Expanded -Filter $Name -File -Recurse | Select-Object -First 1
            if (-not $Binary) { throw "$Name missing from validated package" }
            Copy-Item $Binary.FullName (Join-Path $Payload $Name) -Force
          }
          Copy-Item 'data/locale/en-US.ini' (Join-Path $Payload 'en-US.ini') -Force

      - name: Ensure Inno Setup 6
        id: inno
        shell: pwsh
        run: |
          $Candidates = @('C:\Program Files (x86)\Inno Setup 6\ISCC.exe','C:\Program Files\Inno Setup 6\ISCC.exe')
          $Iscc = $Candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $Iscc) {
            choco install innosetup -y --no-progress
            $Iscc = $Candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $Iscc) { throw 'Inno Setup 6 not found' }
          "path=$Iscc" >> $env:GITHUB_OUTPUT

      - name: Build root-test4 installer
        shell: pwsh
        run: |
          & '${{ steps.inno.outputs.path }}' '/DMyAppVersion=0.4.1-root-test4' 'installer/windows/obs-safe-vst3.iss'
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed: $LASTEXITCODE" }
          $Setup = Get-ChildItem dist -Filter '*root-test4*Setup-x64.exe' -File | Select-Object -First 1
          if (-not $Setup) { throw 'root-test4 installer missing' }
          Get-FileHash -Algorithm SHA256 $Setup.FullName | Format-List

      - name: Upload root-test4 installer
        uses: actions/upload-artifact@v4
        with:
          name: OBS-Safe-VST3-Host-v0.4.1-root-test4-Setup-x64
          path: dist/*root-test4*Setup-x64.exe
          if-no-files-found: error
          retention-days: 7
