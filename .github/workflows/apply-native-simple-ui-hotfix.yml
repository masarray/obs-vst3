name: Apply Native Simple UI Hotfix

on:
  push:
    branches:
      - 'stabilize/v040-crashproof-baseline'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stabilize/v040-crashproof-baseline
          fetch-depth: 0

      - name: Apply hotfix patch if needed
        shell: bash
        run: |
          set -euo pipefail
          PATCH='.github/patches/native-simple-ui-immediate-load.patch'
          if git apply --check "$PATCH"; then
            git apply "$PATCH"
          else
            echo 'Patch already applied or source no longer matches; checking marker.'
            if grep -q 'Native OBS VST keeps its editor button' src/obs-plugin/plugin.cpp; then
              exit 0
            fi
            echo 'Patch could not be applied and expected marker is absent.' >&2
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/obs-plugin/plugin.cpp
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'fix: restore native simple VST3 UI and immediate load'
          git push origin HEAD:stabilize/v040-crashproof-baseline
