name: Test Build Artifact

on:
  pull_request:
    paths:
      - '.github/workflows/test-build-artifact.yml'

permissions:
  contents: read

jobs:
  windows-test-package:
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Fetch OBS 32.2.2
        run: git clone --branch 32.2.2 --depth 1 --recurse-submodules --shallow-submodules https://github.com/obsproject/obs-studio.git .obs-sdk

      - name: Adapt OBS preset to hosted VS2022
        working-directory: .obs-sdk
        run: |
          $Path = 'CMakePresets.json'
          $Text = Get-Content $Path -Raw
          $Text = $Text.Replace('Visual Studio 18 2026', 'Visual Studio 17 2022')
          $Text = $Text.Replace('x64,version=10.0.26100.0', 'x64')
          Set-Content -Path $Path -Value $Text -Encoding UTF8

      - name: Build OBS/libobs SDK
        working-directory: .obs-sdk
        env:
          CI: 'true'
        run: .\.github\scripts\Build-Windows.ps1 -Target x64 -Configuration Release

      - name: Stage libobs development package
        id: libobs
        run: |
          $Generated = Get-ChildItem -Path '.obs-sdk' -Filter 'libobsConfig.cmake' -File -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch '[\\/]install[\\/]' } |
            Select-Object -First 1
          if (-not $Generated) { throw 'Generated libobsConfig.cmake was not found after the OBS build.' }

          $BuildRoot = Split-Path $Generated.Directory.FullName -Parent
          if (-not (Test-Path (Join-Path $BuildRoot 'cmake_install.cmake'))) {
            throw "Could not derive the OBS CMake build root from $($Generated.FullName)."
          }

          $SdkPrefix = Join-Path $env:RUNNER_TEMP 'obs-libobs-sdk'
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $SdkPrefix
          cmake --install $BuildRoot --prefix $SdkPrefix --config Release --component Development
          if ($LASTEXITCODE -ne 0) { throw "Installing OBS Development component failed with exit code $LASTEXITCODE." }

          $Config = Get-ChildItem -Path $SdkPrefix -Filter 'libobsConfig.cmake' -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $Config) { throw 'libobsConfig.cmake was not installed.' }
          if (-not (Test-Path (Join-Path $Config.Directory.FullName 'libobsTargets.cmake'))) { throw 'libobsTargets.cmake missing.' }
          if (-not (Test-Path (Join-Path $Config.Directory.FullName 'finders\FindSIMDe.cmake'))) { throw 'FindSIMDe.cmake missing.' }

          $W32PthreadsConfig = Get-ChildItem -Path $SdkPrefix -Filter 'w32-pthreadsConfig.cmake' -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $W32PthreadsConfig) { throw 'w32-pthreadsConfig.cmake missing.' }

          $ObsDepsPrefix = Get-ChildItem -Path '.obs-sdk\.deps' -Directory -Filter 'obs-deps-*-x64' -ErrorAction SilentlyContinue |
            Where-Object { Test-Path (Join-Path $_.FullName 'include\simde\simde-common.h') } |
            Select-Object -First 1
          if (-not $ObsDepsPrefix) { throw 'OBS public dependency prefix containing SIMDe was not found.' }

          "dir=$($Config.Directory.FullName)" >> $env:GITHUB_OUTPUT
          "prefix=$SdkPrefix" >> $env:GITHUB_OUTPUT
          "deps_prefix=$($ObsDepsPrefix.FullName)" >> $env:GITHUB_OUTPUT

      - name: Configure OBS Safe VST3 Host
        run: |
          cmake -S . -B build/test -A x64 `
            "-Dlibobs_DIR=${{ steps.libobs.outputs.dir }}" `
            "-DCMAKE_PREFIX_PATH=${{ steps.libobs.outputs.prefix }};${{ steps.libobs.outputs.deps_prefix }}" `
            -DSAFEVST3_BUILD_OBS_PLUGIN=ON `
            -DSAFEVST3_BUILD_TESTS=ON

      - name: Build plugin, helper, scanner and tests
        run: cmake --build build/test --config Release --target obs-safe-vst3 obs-safe-vst3-host obs-safe-vst3-scanner protocol-layout-test --parallel

      - name: Run Windows tests
        run: ctest --test-dir build/test -C Release --output-on-failure

      - name: Scanner smoke test
        run: |
          $Scanner = Get-ChildItem build/test -Filter 'obs-safe-vst3-scanner.exe' -File -Recurse | Select-Object -First 1
          if (-not $Scanner) { throw 'scanner executable missing' }
          $Cache = Join-Path $env:RUNNER_TEMP 'scanner-smoke.tsv'
          Remove-Item -Force -ErrorAction SilentlyContinue $Cache
          $Process = Start-Process -FilePath $Scanner.FullName -ArgumentList '--scan-to', "`"$Cache`"" -Wait -PassThru
          if ($Process.ExitCode -ne 0) { throw "scanner exited $($Process.ExitCode)" }
          if (-not (Test-Path $Cache)) { throw 'scanner did not create cache' }

      - name: Ensure Inno Setup 6
        id: inno
        run: |
          $Candidates = @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe'
          )
          $Iscc = $Candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $Iscc) {
            choco install innosetup -y --no-progress
            $Iscc = $Candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $Iscc) { throw 'Inno Setup 6 compiler could not be located.' }
          "path=$Iscc" >> $env:GITHUB_OUTPUT

      - name: Build test installer and portable ZIP
        run: |
          .\scripts\package-windows.ps1 `
            -BuildDir 'build/test' `
            -Version '0.4.1-rc.1' `
            -Iscc '${{ steps.inno.outputs.path }}'

      - name: Validate test package
        run: |
          $Setup = Get-ChildItem dist -Filter 'OBS-Safe-VST3-Host-v0.4.1-rc.1-Setup-x64.exe' -File | Select-Object -First 1
          $Zip = Get-ChildItem dist -Filter 'OBS-Safe-VST3-Host-v0.4.1-rc.1-Windows-x64-Portable.zip' -File | Select-Object -First 1
          $Sums = Get-Item 'dist\SHA256SUMS.txt' -ErrorAction SilentlyContinue
          if (-not $Setup) { throw 'test installer missing' }
          if (-not $Zip) { throw 'test portable ZIP missing' }
          if (-not $Sums) { throw 'SHA256SUMS.txt missing' }

          $Extract = Join-Path $env:RUNNER_TEMP 'portable-test'
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $Extract
          Expand-Archive -Path $Zip.FullName -DestinationPath $Extract -Force
          foreach ($Relative in @(
            'obs-plugins\64bit\obs-safe-vst3.dll',
            'obs-plugins\64bit\obs-safe-vst3-host.exe',
            'obs-plugins\64bit\obs-safe-vst3-scanner.exe',
            'data\obs-plugins\obs-safe-vst3\locale\en-US.ini',
            'README-FIRST.txt',
            'UNINSTALL-MANUAL.cmd'
          )) {
            if (-not (Test-Path (Join-Path $Extract $Relative))) { throw "portable package missing: $Relative" }
          }

      - name: Upload non-public test build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OBS-Safe-VST3-Host-v0.4.1-rc.1-test-windows-x64
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/OBS-Safe-VST3-Host-v0.4.1-rc.1-Setup-x64.exe
            dist/OBS-Safe-VST3-Host-v0.4.1-rc.1-Windows-x64-Portable.zip
            dist/SHA256SUMS.txt
